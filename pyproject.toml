[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku-solver"
version = "0.1.0"
description = "End-to-end sudoku solver: grid detection, digit classification, constraint solving"
requires-python = ">=3.10"
dependencies = [
    "torch>=1.9.0",
    "torchvision>=0.10.0",
    "opencv-python>=4.5.0",
    "numpy>=1.21.0",
    "pillow>=8.0.0",
    "xgboost>=1.5.0",
    "scikit-learn>=1.0.0",
    "h5py>=3.1.0",
    "ortools>=9.0.0",
    "imutils>=0.5.4",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "tqdm>=4.62.0",
    "loguru>=0.6.0",
    "jupyter>=1.0.0",
    "tensorboard>=2.7.0",
    "streamlit>=1.35.0",
    "roboflow>=1.3.10",
    "ultralytics>=8.4.123",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "jupyter>=1.0.0",
    "tensorboard>=2.15.0",
]

[project.scripts]
sudoku-solver = "sudoku_solver.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
